name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o daraku-linux-amd64 cmd/daraku/main.go
          GOOS=linux GOARCH=arm64 go build -o daraku-linux-arm64 cmd/daraku/main.go
          GOOS=darwin GOARCH=amd64 go build -o daraku-macos-amd64 cmd/daraku/main.go
          GOOS=darwin GOARCH=arm64 go build -o daraku-macos-arm64 cmd/daraku/main.go
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          overwrite: true
          fail_on_unmatched_files: false
          files: |
            daraku-linux-amd64
            daraku-linux-arm64
            daraku-macos-amd64
            daraku-macos-arm64
